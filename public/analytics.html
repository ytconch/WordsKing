<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=20260722a" />
    <link rel="apple-touch-icon" sizes="192x192" href="/wordking-icon-192.png?v=20260722a" />
    <title>Words King | 趨勢</title>
    <link rel="stylesheet" href="/styles.css?v=20260722b" />
  </head>
  <body data-page="analytics">
    <div id="siteHeader"></div>
    <main class="page-shell">
      <section class="page-heading">
        <div>
          <p class="eyebrow dark">Analytics</p>
          <h1>學習趨勢</h1>
        </div>
      </section>

      <section id="analyticsOverview" class="metrics-grid"></section>
      <section id="streakCards" class="metrics-grid metrics-grid-compact"></section>

      <section class="analytics-layout">
        <div class="card analytics-chart-card">
          <h2>近 14 天作答</h2>
          <div id="trendList" class="trend-list"></div>
        </div>

        <div class="card analytics-side-card">
          <h2>題型表現</h2>
          <div id="modeBreakdown" class="list"></div>
        </div>

        <div class="card analytics-side-card">
          <h2>單元表現</h2>
          <div id="unitPerformance" class="list"></div>
        </div>
      </section>

      <section class="card">
        <h2>錯題重點</h2>
        <div id="weakWords" class="list list-two"></div>
      </section>
    </main>
    <div id="messageBar" class="message-bar"></div>
    <script src="/shared.js?v=20260722e"></script>
    <script src="/analytics-page.js?v=20260520g"></script>
  </body>
</html>
