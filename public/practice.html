<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=20260722a" />
    <link rel="apple-touch-icon" sizes="192x192" href="/wordking-icon-192.png?v=20260722a" />
    <title>Words King | 練習</title>
    <link rel="stylesheet" href="/styles.css?v=20260908b" />
  </head>
  <body data-page="practice">
    <div id="siteHeader"></div>
    <main class="page-shell">
      <section class="page-heading">
        <div>
          <p class="eyebrow dark">Practice</p>
          <h1>練習</h1>
        </div>
      </section>

      <section id="setupCard" class="practice-layout">
        <section class="card practice-config-card">
          <div class="section-title-row">
            <div>
              <h2>範圍設定</h2>
            </div>
          </div>

          <div class="toolbar compact-toolbar practice-filter-grid">
            <label class="input-group">
              來源
              <select id="practiceSource" aria-label="來源"></select>
            </label>

            <div class="input-group practice-scope-control">
              <span class="practice-scope-label">單字範圍</span>
              <div id="practiceScopeSwitch" class="practice-scope-switch" role="group" aria-label="練習單字範圍">
                <button
                  type="button"
                  id="practiceScopeAllBtn"
                  class="practice-scope-option is-active"
                  data-scope="all"
                  aria-pressed="true"
                >
                  全部單字
                </button>
                <button
                  type="button"
                  id="practiceScopeStarredBtn"
                  class="practice-scope-option"
                  data-scope="starred"
                  aria-pressed="false"
                >
                  <span class="scope-option-icon">⭐</span>
                  <span>僅標記單字</span>
                </button>
              </div>
              <input type="checkbox" id="practiceStarredOnly" style="display: none;" />
            </div>

            <div id="unitSelectorContainer" class="custom-unit-selector">
              <p class="small-text muted">單元</p>
              <div id="practiceUnit" class="unit-pills-grid"></div>
              <div id="practiceUnitSummary" class="small-text muted practice-summary-line"></div>
            </div>
          </div>
        </section>

        <section class="card practice-kind-card">
          <div class="section-title-row practice-kind-head">
            <div>
              <h2>練習模式</h2>
            </div>
            <div class="practice-kind-switch" role="tablist" aria-label="練習模式切換">
              <button
                type="button"
                role="tab"
                class="practice-kind-tab is-active"
                id="normalPracticeTab"
                data-practice-kind="normal"
                aria-selected="true"
                aria-controls="normalPracticePanel"
              >
                一般練習
              </button>
              <button
                type="button"
                role="tab"
                class="practice-kind-tab"
                id="clozePracticeTab"
                data-practice-kind="cloze"
                aria-selected="false"
                aria-controls="clozePracticePanel"
              >
                克漏字
              </button>
            </div>
          </div>

          <div class="practice-kind-panels">
            <section
              class="practice-kind-panel practice-mode-panel"
              id="normalPracticePanel"
              role="tabpanel"
              aria-labelledby="normalPracticeTab"
              data-practice-kind-panel="normal"
            >
              <div class="input-group practice-mode-section">
                <span class="practice-mode-title">題型</span>
                <div id="practiceModeSelector" class="practice-mode-grid">
                  <label class="practice-mode-card">
                    <input type="checkbox" name="practiceModes" value="zh_to_en" checked />
                    <span class="practice-mode-check" aria-hidden="true"></span>
                    <div class="practice-mode-copy">
                      <strong>中翻英</strong>
                    </div>
                  </label>

                  <label class="practice-mode-card">
                    <input type="checkbox" name="practiceModes" value="en_to_zh" checked />
                    <span class="practice-mode-check" aria-hidden="true"></span>
                    <div class="practice-mode-copy">
                      <strong>英翻中</strong>
                    </div>
                  </label>

                  <label class="practice-mode-card">
                    <input type="checkbox" name="practiceModes" value="type_en_from_zh" checked />
                    <span class="practice-mode-check" aria-hidden="true"></span>
                    <div class="practice-mode-copy">
                      <strong>看中文拼字</strong>
                    </div>
                  </label>
                </div>
              </div>

              <div class="practice-start-row">
                <label class="input-group">
                  題數
                  <input type="number" id="practiceLimit" value="20" min="10" max="5000" step="1" />
                </label>
                <button id="loadPracticeBtn" type="button">開始一般練習</button>
              </div>
              <div id="normalPracticeSummary" class="small-text muted practice-summary-line"></div>
            </section>

            <section
              class="practice-kind-panel practice-mode-panel cloze-panel"
              id="clozePracticePanel"
              role="tabpanel"
              aria-labelledby="clozePracticeTab"
              data-practice-kind-panel="cloze"
              hidden
            >
              <div class="practice-kind-copy">
                <strong>克漏字</strong>
                <span class="small-text muted">用例句缺字的方式練習拼字與語境判斷。</span>
              </div>

              <div class="practice-start-row">
                <label class="input-group">
                  題數
                  <input type="number" id="clozeLimit" value="10" min="1" max="5000" step="1" />
                </label>
                <button id="loadClozeBtn" type="button">開始克漏字</button>
              </div>
              <div id="clozeSummary" class="small-text muted practice-summary-line"></div>
            </section>
          </div>
        </section>
      </section>

      <section id="practiceArea" class="card empty practice-stage"></section>
    </main>
    <div id="messageBar" class="message-bar"></div>
    <script src="/shared.js?v=20260909a"></script>
    <script src="/practice-page.js?v=20260908b"></script>
  </body>
</html>
